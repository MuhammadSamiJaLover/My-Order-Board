<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Order Tracking Board</title>
    <style>
        :root {
            --bg-color: #0a0c16;
            --card-bg: #121629;
            --text-color: #ffffff;
            --prep-color: #00f0ff;
            --ready-color: #ff007f;
            --glow-prep: 0 0 15px rgba(0, 240, 255, 0.4);
            --glow-ready: 0 0 15px rgba(255, 0, 127, 0.4);
            --border: #1e2442;
            --danger: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121526;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-title {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .clock {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 700;
            color: var(--prep-color);
        }

        /* Main Grid Container */
        .board-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        .column {
            background-color: rgba(18, 22, 41, 0.6);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 800;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .prep-header { color: var(--prep-color); }
        .ready-header { color: var(--ready-color); }

        .count-badge {
            background: var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #fff;
        }

        /* Card Container & Responsive Cards */
        .cards-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .order-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-card.prep {
            border: 2px solid var(--prep-color);
            box-shadow: var(--glow-prep);
        }

        .order-card.ready {
            border: 2px solid var(--ready-color);
            box-shadow: var(--glow-ready);
            animation: pulse 2s infinite alternate;
        }

        .order-number {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
        }

        .prep .order-number { color: var(--prep-color); }
        .ready .order-number { color: #fff; }

        /* Control Panel Floating Toggle Button */
        .control-panel-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #6b46c1, #3b82f6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.4);
            z-index: 100;
        }

        /* Kitchen Drawer Slide-up Panel */
        #kitchen-drawer {
            display: none;
            position: fixed;
            bottom: 75px;
            right: 20px;
            width: calc(100% - 40px);
            max-width: 450px;
            background: #14172b;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
            z-index: 99;
        }

        .drawer-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #a0a5c0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .btn-add {
            background: var(--prep-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .kitchen-item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .k-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-ready-action {
            background: var(--ready-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        /* --- RESPONSIVE BREAKPOINTS --- */
        @media (max-width: 767px) {
            body { padding: 10px; }
            header { justify-content: center; text-align: center; }
            .board-container { grid-template-columns: 1fr; }
            .control-panel-btn {
                position: fixed;
                bottom: 15px;
                right: 15px;
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">Food Street Pickup</div>
        <div class="clock" id="clock">00:00:00 PM</div>
    </header>

    <div class="board-container">
        <!-- Preparation Column -->
        <div class="column">
            <div class="column-header prep-header">
                <span>Preparation</span>
                <span class="count-badge" id="prep-count">0</span>
            </div>
            <div class="cards-list" id="prep-grid"></div>
        </div>

        <!-- Ready for Pickup Column -->
        <div class="column">
            <div class="column-header ready-header">
                <span>Ready for Pickup</span>
                <span class="count-badge" id="ready-count">0</span>
            </div>
            <div class="cards-list" id="ready-grid"></div>
        </div>
    </div>

    <!-- Toggle Drawer Button -->
    <button class="control-panel-btn" onclick="toggleKitchen()">⚙️ Kitchen Control Panel</button>

    <!-- Kitchen Control Drawer -->
    <div id="kitchen-drawer">
        <div class="drawer-title">Kitchen Order Manager</div>
        <div class="input-row">
            <input type="number" id="orderInput" placeholder="Order #" />
            <button class="btn-add" onclick="addOrder()">Add Order</button>
        </div>
        <div class="kitchen-item-list" id="kitchenList"></div>
    </div>

    <script>
        // Active Orders State
        let activeOrders = {
            preparing: ["220", "219"],
            ready: ["217", "08"]
        };

        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 1. Web Audio API - Two-Tone Notification Chime
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // Note C5
                osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.25); // Note G5

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.7);
            } catch (e) {
                console.log("Audio play blocked by browser interaction rules.");
            }
        }

        // 2. Web Speech API - Voice Announcement ("Order [ID] ready")
        function announceOrder(id) {
            playChime();
            setTimeout(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const text = `Order ${id} ready`;
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.95;
                    window.speechSynthesis.speak(utterance);
                }
            }, 450);
        }

        // Add Order to Preparing
        function addOrder() {
            const input = document.getElementById('orderInput');
            const val = input.value.trim();
            if (!val) return;

            if (!activeOrders.preparing.includes(val) && !activeOrders.ready.includes(val)) {
                activeOrders.preparing.push(val);
                render();
            }
            input.value = '';
        }

        // Move Order from Preparing to Ready & Trigger Announcement
        function markReady(id) {
            activeOrders.preparing = activeOrders.preparing.filter(item => item !== id);
            if (!activeOrders.ready.includes(id)) {
                activeOrders.ready.push(id);
                announceOrder(id); // <--- Triggers Chime + Speech
            }
            render();
        }

        // Remove Completed Order
        function removeOrder(id) {
            activeOrders.preparing = activeOrders.preparing.filter(item => item !== id);
            activeOrders.ready = activeOrders.ready.filter(item => item !== id);
            render();
        }

        // Render UI Elements
        function render() {
            // Update Preparing List
            const prepGrid = document.getElementById('prep-grid');
            document.getElementById('prep-count').textContent = activeOrders.preparing.length;
            prepGrid.innerHTML = activeOrders.preparing.map(id => `
                <div class="order-card prep">
                    <div class="order-number">${id}</div>
                </div>
            `).join('');

            // Update Ready List
            const readyGrid = document.getElementById('ready-grid');
            document.getElementById('ready-count').textContent = activeOrders.ready.length;
            readyGrid.innerHTML = activeOrders.ready.map(id => `
                <div class="order-card ready">
                    <div class="order-number">${id}</div>
                </div>
            `).join('');

            // Update Kitchen Control Drawer Queue
            const kitchenList = document.getElementById('kitchenList');
            let itemsHtml = '';

            activeOrders.preparing.forEach(id => {
                itemsHtml += `
                    <div class="k-item">
                        <span>Order #${id}</span>
                        <div>
                            <button class="btn-ready-action" onclick="markReady('${id}')">Mark Ready →</button>
                            <button class="btn-del" onclick="removeOrder('${id}')">✕</button>
                        </div>
                    </div>
                `;
            });

            activeOrders.ready.forEach(id => {
                itemsHtml += `
                    <div class="k-item" style="border-color: var(--ready-color);">
                        <span>Order #${id} (Ready)</span>
                        <button class="btn-del" onclick="removeOrder('${id}')">Clear</button>
                    </div>
                `;
            });

            kitchenList.innerHTML = itemsHtml;
        }

        // Toggle Control Drawer Visibility
        function toggleKitchen() {
            const drawer = document.getElementById('kitchen-drawer');
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        }

        // Initial Render
        render();
    </script>
</body>
</html>
