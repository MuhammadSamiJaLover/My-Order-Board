<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Order Tracking Board</title>
    <style>
        :root {
            --bg-color: #0a0c16;
            --card-bg: #121629;
            --text-color: #ffffff;
            --prep-color: #00f0ff;
            --ready-color: #ff007f;
            --glow-prep: 0 0 15px rgba(0, 240, 255, 0.4);
            --glow-ready: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121526;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #1e2442;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-title {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .clock {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 700;
            color: var(--prep-color);
        }

        /* Main Grid Container */
        .board-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        .column {
            background-color: rgba(18, 22, 41, 0.6);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1e2442;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 800;
            padding-bottom: 12px;
            border-bottom: 2px solid #1e2442;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .prep-header { color: var(--prep-color); }
        .ready-header { color: var(--ready-color); }

        .count-badge {
            background: #1e2442;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #fff;
        }

        /* Card Container & Responsive Cards */
        .cards-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .order-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-card.prep {
            border: 2px solid var(--prep-color);
            box-shadow: var(--glow-prep);
        }

        .order-card.ready {
            border: 2px solid var(--ready-color);
            box-shadow: var(--glow-ready);
            animation: pulse 2s infinite alternate;
        }

        .order-number {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            margin-bottom: 5px;
        }

        .prep .order-number { color: var(--prep-color); }
        .ready .order-number { color: #fff; }

        .order-timer {
            font-size: 0.85rem;
            color: #a0a5c0;
            font-family: monospace;
        }

        /* Control Panel Button */
        .control-panel-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #6b46c1, #3b82f6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.4);
            z-index: 100;
        }

        /* --- RESPONSIVE BREAKPOINTS --- */
        /* Phone View (Widths under 768px) */
        @media (max-width: 767px) {
            body {
                padding: 10px;
            }

            header {
                justify-content: center;
                text-align: center;
            }

            .board-container {
                grid-template-columns: 1fr; /* Stacks Preparation and Ready vertically */
            }

            .cards-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .control-panel-btn {
                position: static;
                width: 100%;
                margin-top: 15px;
                text-align: center;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">Food Street Pickup</div>
        <div class="clock" id="clock">00:00:00 PM</div>
    </header>

    <div class="board-container">
        <!-- Preparation Column -->
        <div class="column">
            <div class="column-header prep-header">
                <span>Preparation</span>
                <span class="count-badge" id="prep-count">2</span>
            </div>
            <div class="cards-list">
                <div class="order-card prep">
                    <div class="order-number">220</div>
                    <div class="order-timer">00:46</div>
                </div>
                <div class="order-card prep">
                    <div class="order-number">219</div>
                    <div class="order-timer">01:10</div>
                </div>
            </div>
        </div>

        <!-- Ready for Pickup Column -->
        <div class="column">
            <div class="column-header ready-header">
                <span>Ready for Pickup</span>
                <span class="count-badge" id="ready-count">2</span>
            </div>
            <div class="cards-list">
                <div class="order-card ready">
                    <div class="order-number">217</div>
                    <div class="order-timer">01:01</div>
                </div>
                <div class="order-card ready">
                    <div class="order-number">08</div>
                    <div class="order-timer">00:39</div>
                </div>
            </div>
        </div>
    </div>

    <button class="control-panel-btn">⚙️ Kitchen Control Panel</button>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
